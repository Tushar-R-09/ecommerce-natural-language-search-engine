[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "natural-language-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
    "torchvision>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]


[dependency-groups]
dev = [
    "pyrefly==1.2.0",
]
