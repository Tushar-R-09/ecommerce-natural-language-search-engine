apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: qdrant-network-policy

spec:
  podSelector:
    matchLabels:
      app: qdrant

  policyTypes:
    - Ingress

  ingress:
    # Allow incoming traffic to Qdrant only from authorized application pods
    - from:
        - podSelector:
            matchLabels:
              app: streamlit
        - podSelector:
            matchLabels:
              app: qdrant-indexing
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
